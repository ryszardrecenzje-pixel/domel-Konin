name: Dodaj przyciski do koszyka

on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python add_ask_price_buttons.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: przyciski Dodaj do koszyka zamiast Zapytaj o cene"
          branch: main
