name: Auto Scraper i Aktualizacja Strony

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write # <-- TO JEST KLUCZOWE, ŻEBY BOT MÓGŁ ZAPISYWAĆ PLIKI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu scrapera
        run: python scraper.py

      - name: Zapisanie i wysłanie zmian na GitHuba
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja strony" && git push)
