name: Napraw niebezpieczne nazwy plikow

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Uruchom fix_safe_filenames.py
        run: python fix_safe_filenames.py

      - name: Commit i push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: bezpieczne nazwy plikow (# ? spacje nawiasy -> _)"
          branch: main
