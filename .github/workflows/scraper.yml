name: Uruchom scraper AGD

on:
  schedule:
    - cron: '0 8 * * *' # Codziennie o 8:00 rano (lub wg Twoich ustawień)
  workflow_dispatch: # Pozwala na ręczne uruchomienie przyciskiem

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Wymagane do zapisywania plików w repozytorium

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu scrapera
        run: |
          python scraper.py

      - name: Automatyczny zapis wygenerowanych stron
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja cen i podstron produktów"
          branch: main
